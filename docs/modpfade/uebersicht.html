<title>Modpfade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kopf, darunter ein Raster aus großen Kacheln (eine je Mod, ganze Kachel ist der Link), dann geplante Mods und weitere Übersichten.
   Farben und Schriften wie die Modpfad-Seiten; jede Kachel trägt die Akzentfarbe ihres Mods. */
:root{
  --bg:#1b1d20; --panel:#24272b; --line:#34383e; --fg:#e7e5e1; --muted:#9a9890;
  --accent:#e0a33a; --slot:#2f3338; --slot-edge:#15171a; --slot-hi:#474c53; --chip:#2c3035;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1efea; --panel:#fbfaf7; --line:#d9d5cc; --fg:#24221f; --muted:#6c675e;
  --accent:#a36a12; --slot:#c9c5bb; --slot-edge:#8f8a7f; --slot-hi:#e9e6de; --chip:#ebe7df; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1efea; --panel:#fbfaf7; --line:#d9d5cc; --fg:#24221f; --muted:#6c675e;
  --accent:#a36a12; --slot:#c9c5bb; --slot-edge:#8f8a7f; --slot-hi:#e9e6de; --chip:#ebe7df; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:32px 56px;display:grid;gap:36px}
header{display:grid;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,44px);letter-spacing:.02em;margin:0}
h1 span{color:var(--accent)}
.lede{color:var(--muted);max-width:68ch;margin:0}
h2{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
a.tile{--a:var(--accent);display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start;padding:18px;background:var(--panel);
  border:1px solid var(--line);border-top:4px solid var(--a);border-radius:4px;color:inherit;text-decoration:none;transition:transform .12s ease,border-color .12s ease}
a.tile:hover,a.tile:focus-visible{transform:translateY(-2px);border-color:var(--a);outline:none}
a.tile:focus-visible{box-shadow:0 0 0 2px var(--a)}
.pic{width:96px;height:96px;background:var(--slot);border:2px solid;border-color:var(--slot-edge) var(--slot-hi) var(--slot-hi) var(--slot-edge);display:grid;place-items:center}
.pic img{max-width:80px;max-height:80px;width:auto;height:auto}
.pic img.px{width:64px;height:64px;image-rendering:pixelated;object-fit:cover;object-position:top}
.body{display:grid;gap:6px;min-width:0}
.name{font:700 21px var(--f-display);letter-spacing:.02em;line-height:1.15;color:var(--a);overflow-wrap:anywhere}
.ver{font:12px var(--f-data);color:var(--muted)}
.txt{margin:0;font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:12px var(--f-data);background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--muted)}
.chip b{color:var(--fg);font-weight:600}
.go{font:600 13px var(--f-body);color:var(--a);margin-top:4px}

.planned{display:flex;flex-wrap:wrap;gap:8px}
.planned span{font-size:14px;border:1px dashed var(--line);border-radius:3px;padding:5px 10px;color:var(--muted)}
.more{display:grid;gap:8px;max-width:68ch}
.more a{color:var(--accent);font-weight:600}
.more span{color:var(--muted)}
@media (prefers-reduced-motion: reduce){a.tile{transition:none}a.tile:hover,a.tile:focus-visible{transform:none}}
@media (max-width:420px){a.tile{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="wrap">
  <header>
    <h1>Mod<span>pfade</span></h1>
    <p class="lede" id="lede"></p>
  </header>
  <section>
    <h2>Fertige Seiten</h2>
    <div class="tiles" id="tiles"></div>
  </section>
  <section>
    <h2>Noch ohne Seite</h2>
    <div class="planned" id="planned"></div>
  </section>
  <section>
    <h2>Weitere Übersichten</h2>
    <div class="more" id="more"></div>
  </section>
</div>
