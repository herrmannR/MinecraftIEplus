# Steuerdatei für das Ad-Astra-Kapitel (Teil 1 bis K11), Quelle docs/questtexte/adastra.md
# Bauen:  java tools/QuestbuchGen.java docs/questtexte/adastra.md tools/questbuch/adastra.cfg config-overrides/config/ftbquests/quests/chapters/adastra.snbt

chapter = adastra
title = Ad Astra
icon = ad_astra:tier_1_rocket
order = 17
bis = K11

# Treibstoffe: Hin- und Rückflug (3 Eimer je Start; ab T4 sparsam, 1 Eimer je Start)
RF1-06 tasks = fluid(immersiveengineering:biodiesel, 6000)
RF1-06 icon = immersiveengineering:biodiesel_bucket
RF1-07 tasks = item(ad_astra:oxygen_loader); fluid(mekanism:oxygen, 1000)
RF2-10 tasks = item(ad_astra:tier_2_rocket); fluid(immersivepetroleum:diesel, 6000)
RF3-08 tasks = item(ad_astra:tier_3_rocket); fluid(immersivepetroleum:kerosene, 6000)
RF4-06 tasks = item(ad_astra:tier_4_rocket); fluid(kubejs:kryo_treibstoff, 2000)

# Giselle-Reihe: schon vor dem Start sinnvoll
RF1-12 deps = RF1-05
RF1-13 deps = RF1-05
RF1-14 deps = RF1-03
RF1-15 deps = RF1-08

# Orbit von Erde oder Mond: keine Oder-Aufgabe für Dimensionen
RF2-02 tasks = dim(ad_astra:earth_orbit)
RF2-02 icon = ad_astra:launch_pad

# RFX und RFY haben kein (Kn) in der Überschrift (ein Kn je Kapitel nur einmal, sonst doppelte Marken-ID);
# sie werden über ihre Abhängigkeit sichtbar.
# Schutz ohne Raumanzug: ab dem Mond (Moon Stone), nicht hinter Glacio
RFX-01 deps = RF1-11
RFX-01 icon = minecraft:enchanted_book
RFX-02 deps = RFX-01
RFX-02 icon = tconstruct:plate_chestplate

# Sky Stone braucht Mars Stone
RFY-01 deps = RF2-11
